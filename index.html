<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ТРКИ-C1 智能词汇测试</title>
<style>
:root{--bg:#f5f5f8;--panel:#fff;--text:#17171a;--muted:#777780;--line:#dddde5;--accent:#5b5bd6;--ok:#e9f7ed;--warn:#fff5d7;--bad:#fff0f0;--a:#edf3ff;--r:#f5eeff;--g:#fff0c9}
@media(prefers-color-scheme:dark){:root{--bg:#111116;--panel:#1c1c22;--text:#f5f5f6;--muted:#aaaab4;--line:#383842;--accent:#8e8ef5;--ok:#203127;--warn:#3a351f;--bad:#3b2424;--a:#232a42;--r:#30243a;--g:#3b311e}}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 44px}h1{font-size:22px;margin:0 0 6px}.sub,.muted{font-size:13px;line-height:1.55;color:var(--muted)}
.panel{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:15px}.panel h2{font-size:16px;margin:0 0 10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{text-align:center;background:var(--bg);border-radius:13px;padding:10px 6px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
button,select,input,.filebtn{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:13px;padding:12px;font-size:15px}.filebtn{display:block;text-align:center;cursor:pointer}input[type=file]{display:none}button{cursor:pointer}.primary{background:var(--accent);border:0;color:#fff;font-weight:700;font-size:17px;padding:14px}.danger{background:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.settings{display:grid;grid-template-columns:1.1fr .9fr;gap:8px;align-items:center}.settings label{font-size:13px;color:var(--muted)}
#testView{display:none}.topline{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px;margin-bottom:10px}.bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}.bar>div{height:100%;width:0;background:var(--accent)}
.qbox{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:24px;min-height:390px;display:flex;flex-direction:column;justify-content:center}.badges{display:flex;gap:7px;justify-content:center;margin-bottom:14px}.badge{font-size:12px;font-weight:700;border-radius:999px;padding:5px 9px}.badge.a{background:var(--a)}.badge.r{background:var(--r)}.badge.g{background:var(--g)}
.prompt{text-align:center;font-size:27px;line-height:1.45}.ru{font-family:"Times New Roman",serif;font-size:39px;line-height:1.3}.instruction{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
.answer{margin-top:20px}.answer input{font-family:"Times New Roman",serif;font-size:21px;padding:14px}.choices{display:grid;gap:9px}.choices button{text-align:left;padding:14px}.choices button.selected{outline:2px solid var(--accent)}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:13px;line-height:1.55}.feedback.ok{display:block;background:var(--ok)}.feedback.warn{display:block;background:var(--warn)}.feedback.bad{display:block;background:var(--bad)}
.reviewBtns{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.reviewBtns.show{display:grid}.smallActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kbdhint{font-size:12px;color:var(--muted);margin-top:7px}.footerNote{margin-top:12px;color:var(--muted);font-size:12px;line-height:1.55}.hidden{display:none!important}
@media(max-width:560px){.grid4{grid-template-columns:repeat(2,1fr)}.two,.settings{grid-template-columns:1fr}.prompt{font-size:24px}.ru{font-size:33px}.qbox{padding:21px;min-height:420px}.reviewBtns{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<section id="homeView">
  <h1>ТРКИ-C1 智能词汇测试</h1>
  <div class="sub">这里只负责测试和间隔复习：A 类以主动输入为主；R 类以识别选择题为主；G 类会额外抽格支配/固定搭配。词库会持续累积。</div>

  <div class="panel">
    <div class="grid4">
      <div class="stat"><b id="totalCount">0</b><span>总词库</span></div>
      <div class="stat"><b id="aCount">0</b><span>A</span></div>
      <div class="stat"><b id="rCount">0</b><span>R</span></div>
      <div class="stat"><b id="gCount">0</b><span>G</span></div>
    </div>
  </div>

  <div class="panel">
    <h2>今日任务</h2>
    <div class="row"><span>🆕 新词</span><b id="todayNew">0</b></div>
    <div class="row"><span>🔁 到期复习</span><b id="todayDue">0</b></div>
    <div class="row"><span>⚠️ 弱项复习</span><b id="todayWeak">0</b></div>
    <div class="row"><span>今日预计总量</span><b id="todayTotal">0</b></div>
    <button class="primary" id="startBtn" style="margin-top:12px">开始今日训练</button>
    <div class="footerNote" id="queueNote"></div>
  </div>

  <div class="panel">
    <h2>每日新词设置</h2>
    <div class="settings"><label for="newCap">新词默认上限</label><select id="newCap"><option value="20">20 个</option><option value="30" selected>30 个</option></select></div>
    <div class="footerNote">如果到期复习和弱项太多，系统会自动把当天新词数量降到 20、10 或 0，避免复习积压失控。</div>
  </div>

  <div class="panel">
    <h2>词库与备份</h2>
    <div class="two">
      <label class="filebtn" for="vocabFile">导入新词包 JSON</label><input id="vocabFile" type="file" accept=".json,application/json">
      <button id="exportBtn">导出完整备份</button>
      <label class="filebtn" for="backupFile">恢复完整备份</label><input id="backupFile" type="file" accept=".json,application/json">
      <button id="rebuildBtn">重建今日队列</button>
    </div>
    <div class="footerNote">以后你给我新增词汇，我可以直接给你一个词包 JSON。导入后词库自动累积，旧词的复习记录不会清空。</div>
  </div>
</section>

<section id="testView">
  <div class="topline"><span id="qCounter"></span><span id="qKind"></span></div>
  <div class="bar"><div id="progressBar"></div></div>
  <div class="qbox">
    <div class="badges" id="badges"></div>
    <div class="prompt" id="prompt"></div>
    <div class="instruction" id="instruction"></div>
    <div class="answer" id="answerArea"></div>
    <div class="feedback" id="feedback"></div>
    <div class="reviewBtns" id="selfGradeBtns">
      <button data-grade="correct">✅ 我答对了</button>
      <button data-grade="fuzzy">△ 不稳 / 部分对</button>
      <button data-grade="wrong">❌ 错了</button>
    </div>
    <div class="smallActions">
      <button id="dontKnowBtn">不认识 / 想不起来</button>
      <button id="nextBtn" class="hidden">下一题</button>
    </div>
  </div>
  <button id="exitBtn" style="margin-top:12px">结束本轮并返回首页</button>
</section>
</div>

term":"су́дорожный","level":"R","g":false,"meaning":"痉挛般的；异常紧张的","extra":""},{"term":"мра́чная бле́дность","level":"R","g":false,"meaning":"阴沉、可怕的苍白脸色","extra":""},{"term":"прерва́ть молча́ние","level":"R","g":false,"meaning":"打破沉默","extra":""},{"term":"разлу́ка","level":"R","g":false,"meaning":"离别","extra":""},{"term":"посторо́ннее мне́ние","level":"R","g":false,"meaning":"外人的意见","extra":""},{"term":"тя́гостно","level":"R","g":false,"meaning":"沉重、痛苦、难受地","extra":""},{"term":"сумасбро́д","level":"R","g":false,"meaning":"鲁莽、疯疯癫癫的人","extra":""},{"term":"подверга́ть себя́ чему","level":"R","g":true,"meaning":"使自己遭受；置于……之中","extra":"чему + Д."},{"term":"пощёчина","level":"R","g":false,"meaning":"耳光","extra":""},{"term":"изумле́ние","level":"R","g":false,"meaning":"惊讶","extra":""},{"term":"перве́нствовать","level":"R","g":false,"meaning":"居首；争第一","extra":""},{"term":"бу́йство","level":"R","g":false,"meaning":"狂放；暴烈行为","extra":""},{"term":"хва́статься чем","level":"R","g":true,"meaning":"以……炫耀","extra":"чем + Т."},{"term":"пья́нство","level":"R","g":false,"meaning":"酗酒；醉酒成风","extra":""},{"term":"сча́стливец","level":"R","g":false,"meaning":"幸运儿","extra":""},{"term":"блиста́тельный","level":"R","g":false,"meaning":"光彩夺目的；卓越的","extra":""},{"term":"беспе́чный","level":"R","g":false,"meaning":"无忧无虑的；漫不经心的","extra":""},{"term":"поколеба́ться","level":"R","g":false,"meaning":"动摇","extra":""},{"term":"обольщённый","level":"R","g":false,"meaning":"被迷住的；受到诱惑的","extra":""},{"term":"отча́яние","level":"R","g":false,"meaning":"绝望","extra":""},{"term":"эпигра́мма","level":"R","g":false,"meaning":"讽刺短诗；讽刺诗句","extra":""},{"term":"зло́бствовать","level":"R","g":false,"meaning":"怀恨；恶意发作","extra":""},{"term":"жре́бий","level":"R","g":false,"meaning":"签；抽签","extra":"бро́сить жре́бий — 抽签决定"},{"term":"прице́литься","level":"R","g":false,"meaning":"瞄准","extra":""},{"term":"равноду́шие","level":"R","g":false,"meaning":"冷漠；无动于衷","extra":""},{"term":"взбеси́ть кого","level":"R","g":true,"meaning":"把某人激怒","extra":"кого + В."},{"term":"дорожи́ть чем","level":"R","g":true,"meaning":"珍惜……","extra":"дорожи́ть жи́знью; чем + Т."},{"term":"мелькну́ть в уме́","level":"R","g":false,"meaning":"念头一闪而过","extra":""},{"term":"изво́лить + инф.","level":"R","g":true,"meaning":"愿意；请（旧式或带讽刺色彩）","extra":"+ инф."},{"term":"возрази́ть кому","level":"R","g":true,"meaning":"反驳某人","extra":"кому + Д."},{"term":"пое́динок","level":"R","g":false,"meaning":"决斗；对决","extra":""},{"term":"отста́вка","level":"R","g":false,"meaning":"退役；辞职","extra":""},{"term":"мще́ние","level":"R","g":false,"meaning":"复仇","extra":""}];
const STORAGE_KEY='trki_c1_srs_v4';
const DAY=86400000;
let db={cards:{},settings:{newCap:30},session:null};
let queue=[];let qi=0;let answered=false;let currentManual=false;

const E=id=>document.getElementById(id);
const homeView=E('homeView'),testView=E('testView'),totalCount=E('totalCount'),aCount=E('aCount'),rCount=E('rCount'),gCount=E('gCount'),todayNew=E('todayNew'),todayDue=E('todayDue'),todayWeak=E('todayWeak'),todayTotal=E('todayTotal'),queueNote=E('queueNote'),newCap=E('newCap'),startBtn=E('startBtn'),vocabFile=E('vocabFile'),backupFile=E('backupFile'),exportBtn=E('exportBtn'),rebuildBtn=E('rebuildBtn'),qCounter=E('qCounter'),qKind=E('qKind'),progressBar=E('progressBar'),badges=E('badges'),prompt=E('prompt'),instruction=E('instruction'),answerArea=E('answerArea'),feedback=E('feedback'),selfGradeBtns=E('selfGradeBtns'),dontKnowBtn=E('dontKnowBtn'),nextBtn=E('nextBtn'),exitBtn=E('exitBtn');

function norm(s){return String(s||'').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ё/g,'е').replace(/\s+/g,' ')}
function keyOf(c){return norm(c.term)}
function now(){return Date.now()}
function startOfToday(){const d=new Date();d.setHours(0,0,0,0);return d.getTime()}
function dateKey(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function newRecord(c){return {...c,status:'new',streak:0,lapses:0,seen:0,lastReviewed:null,nextDue:null,lastWrong:null,errors:{meaning:0,recall:0,spelling:0,governance:0},history:[]}}
function mergeCard(c){if(!c||!c.term||!c.level)return;const k=keyOf(c);if(!db.cards[k])db.cards[k]=newRecord(c);else db.cards[k]={...db.cards[k],...c}}
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const x=JSON.parse(raw);if(x&&x.cards)db=x}}catch(e){};if(!db.settings)db.settings={newCap:30};SEED.forEach(mergeCard);newCap.value=String(db.settings.newCap||30);save()}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db))}catch(e){}}
function cards(){return Object.values(db.cards)}
function isDue(c){return c.status!=='new'&&c.nextDue&&c.nextDue<=now()}
function isWeak(c){return c.status!=='new'&&((c.lastWrong&&c.lastWrong>=startOfToday()-2*DAY)||c.streak<2)}
function schedulerCounts(){const all=cards();const due=all.filter(isDue);const weak=all.filter(c=>isWeak(c)&&!isDue(c));const load=due.length+weak.length;const cap=Number(db.settings.newCap||30);let effective=cap;if(load>=50)effective=0;else if(load>=30)effective=Math.min(10,cap);else if(load>=15)effective=Math.min(20,cap);const fresh=all.filter(c=>c.status==='new').slice(0,effective);return{all,due,weak:weak.slice(0,25),fresh}}
function updateHome(){const c=schedulerCounts();totalCount.textContent=c.all.length;aCount.textContent=c.all.filter(x=>x.level==='A').length;rCount.textContent=c.all.filter(x=>x.level==='R').length;gCount.textContent=c.all.filter(x=>x.g).length;todayNew.textContent=c.fresh.length;todayDue.textContent=c.due.length;todayWeak.textContent=c.weak.length;todayTotal.textContent=c.fresh.length+c.due.length+c.weak.length;queueNote.textContent=c.all.length?`当前词库 ${c.all.length} 个。新词上限 ${db.settings.newCap}；复习负担较高时会自动下调。`:'词库为空。'}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildQueue(){const c=schedulerCounts();const fresh=shuffle([...c.fresh]);const due=shuffle([...c.due]);const weak=shuffle([...c.weak]);const mixed=[];while(fresh.length||due.length||weak.length){if(fresh.length)mixed.push(fresh.shift());if(due.length)mixed.push(due.shift());if(fresh.length)mixed.push(fresh.shift());if(weak.length)mixed.push(weak.shift());if(due.length)mixed.push(due.shift())}queue=mixed.map(keyOf);qi=0;db.session={date:dateKey(),queue:[...queue],qi:0};save()}
function coreTerm(c){let s=c.term;const markers=[' + Д.',' + Р.',' + В.',' + Т.',' + П.',' + инф.'];for(const m of markers){const p=s.indexOf(m);if(p>0)s=s.slice(0,p)}s=s.replace(/\s+(кого\/что|кого|чем|с кем|кому|чему|кем\/чем|кем)$/i,'').trim();return s}
function governanceExpected(c){if(!c.g)return'';let t=c.term;const core=coreTerm(c);let suffix=t.slice(core.length).trim();if(!suffix&&c.extra)suffix=c.extra;return suffix||c.extra||c.term}
function questionType(c){if(c.level==='R')return'mcq';if(c.g&&(c.seen||0)%2===1)return'governance';return'typing'}
function makeBadges(c){badges.innerHTML=`<span class="badge ${c.level.toLowerCase()}">${c.level}</span>${c.g?'<span class="badge g">G</span>':''}`}
function distractors(c){let pool=cards().filter(x=>keyOf(x)!==keyOf(c)).map(x=>x.meaning);pool=[...new Set(pool)];shuffle(pool);return pool.slice(0,3)}
function resetQuestionUI(){answered=false;currentManual=false;feedback.className='feedback';feedback.innerHTML='';selfGradeBtns.classList.remove('show');nextBtn.classList.add('hidden');dontKnowBtn.classList.remove('hidden');answerArea.innerHTML=''}
function showQuestion(){if(qi>=queue.length){finish();return}resetQuestionUI();const c=db.cards[queue[qi]];if(!c){qi++;showQuestion();return}const type=questionType(c);qCounter.textContent=`${qi+1} / ${queue.length}`;progressBar.style.width=`${Math.round((qi/Math.max(queue.length,1))*100)}%`;makeBadges(c);
 if(type==='mcq'){qKind.textContent='俄语 → 中文 · 选择题';prompt.innerHTML=`<span class="ru">${escapeHtml(c.term)}</span>`;instruction.textContent='选择最准确的中文意思。';const opts=shuffle([c.meaning,...distractors(c)]);const box=document.createElement('div');box.className='choices';opts.forEach(o=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>gradeMCQ(c,o);box.appendChild(b)});answerArea.appendChild(box)}
 else if(type==='typing'){qKind.textContent='中文 → 俄语 · 键盘输入';prompt.textContent=c.meaning;instruction.textContent='请输入目标俄语词或表达。重音符号可以不输入。';const inp=document.createElement('input');inp.placeholder='输入俄语';inp.autocomplete='off';inp.autocapitalize='off';inp.spellcheck=false;const b=document.createElement('button');b.textContent='提交';b.style.marginTop='9px';b.onclick=()=>gradeTyping(c,inp.value);inp.onkeydown=e=>{if(e.key==='Enter')b.click()};answerArea.append(inp,b);setTimeout(()=>inp.focus(),100)}
 else {qKind.textContent='格支配 / 固定搭配 · 键盘输入';prompt.innerHTML=`<span class="ru">${escapeHtml(coreTerm(c))}</span>`;instruction.textContent='写出你记得的介词、格或固定搭配。提交后对照答案，再自行判定。';const inp=document.createElement('input');inp.placeholder='例如：к + Д. / от + Р. / чем с кем';inp.autocomplete='off';inp.spellcheck=false;const b=document.createElement('button');b.textContent='查看答案并自评';b.style.marginTop='9px';b.onclick=()=>revealGovernance(c,inp.value);inp.onkeydown=e=>{if(e.key==='Enter')b.click()};answerArea.append(inp,b);setTimeout(()=>inp.focus(),100)}}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
function gradeMCQ(c,chosen){if(answered)return;const ok=chosen===c.meaning;record(c,ok?'correct':'wrong',ok?null:'meaning');feedback.className='feedback '+(ok?'ok':'bad');feedback.innerHTML=(ok?'✅ 正确':'❌ 错误')+`<br><b>${escapeHtml(c.term)}</b> = ${escapeHtml(c.meaning)}`;afterAnswer()}
function gradeTyping(c,value){if(answered)return;const target=coreTerm(c);const ok=norm(value)===norm(target);let err=null;if(!ok){err=norm(value).length?'spelling':'recall'}record(c,ok?'correct':'wrong',err);feedback.className='feedback '+(ok?'ok':'bad');feedback.innerHTML=(ok?'✅ 正确':'❌ 需要复习')+`<br><b>答案：</b> ${escapeHtml(target)}${c.extra?'<br>'+escapeHtml(c.extra):''}`;afterAnswer()}
function revealGovernance(c,value){if(answered)return;answered=true;currentManual={card:c,input:value};dontKnowBtn.classList.add('hidden');feedback.className='feedback warn';feedback.innerHTML=`<b>你的答案：</b> ${escapeHtml(value||'（未作答）')}<br><b>参考答案：</b> ${escapeHtml(governanceExpected(c))}${c.extra?'<br>'+escapeHtml(c.extra):''}`;selfGradeBtns.classList.add('show')}
function manualGrade(grade){if(!currentManual)return;const c=currentManual.card;record(c,grade,grade==='correct'?null:'governance');selfGradeBtns.classList.remove('show');feedback.className='feedback '+(grade==='correct'?'ok':grade==='fuzzy'?'warn':'bad');feedback.innerHTML+=(grade==='correct'?'<br>✅ 已记为正确':grade==='fuzzy'?'<br>△ 已记为模糊':'<br>❌ 已记为错误');currentManual=false;afterAnswer()}
function record(c,grade,errorType){const t=now();c.seen=(c.seen||0)+1;c.lastReviewed=t;c.status='learning';if(!c.history)c.history=[];c.history.push({time:t,grade,errorType});if(c.history.length>80)c.history=c.history.slice(-80);if(grade==='correct'){c.streak=(c.streak||0)+1;const days=c.streak>=5?30:c.streak===4?14:c.streak===3?7:c.streak===2?3:1;c.nextDue=t+days*DAY}else if(grade==='fuzzy'){c.streak=0;c.nextDue=t+DAY;c.lastWrong=t;if(errorType)c.errors[errorType]=(c.errors[errorType]||0)+1;appendSameDay(c)}else{c.streak=0;c.lapses=(c.lapses||0)+1;c.nextDue=t+DAY;c.lastWrong=t;if(errorType)c.errors[errorType]=(c.errors[errorType]||0)+1;appendSameDay(c)}save()}
function appendSameDay(c){const k=keyOf(c);if(!queue.slice(qi+1).includes(k))queue.push(k)}
function afterAnswer(){answered=true;dontKnowBtn.classList.add('hidden');nextBtn.classList.remove('hidden');if(db.session){db.session.queue=[...queue];db.session.qi=qi}save()}
function markDontKnow(){if(answered)return;const c=db.cards[queue[qi]];record(c,'wrong',c.level==='R'?'meaning':'recall');feedback.className='feedback bad';feedback.innerHTML=`❌ 标记为不认识 / 想不起来<br><b>${escapeHtml(c.term)}</b> — ${escapeHtml(c.meaning)}${c.extra?'<br>'+escapeHtml(c.extra):''}`;afterAnswer()}
function nextQuestion(){qi++;if(db.session)db.session.qi=qi;save();showQuestion()}
function finish(){alert('本轮完成。错词会在当天后段或第二天优先复习；稳定正确后间隔会逐步拉长。');db.session=null;save();testView.style.display='none';homeView.style.display='block';updateHome()}
function startSession(){buildQueue();if(!queue.length){alert('今天暂时没有待测试词。');return}homeView.style.display='none';testView.style.display='block';showQuestion()}
function readJSON(file,cb){if(!file)return;const r=new FileReader();r.onload=()=>{try{cb(JSON.parse(r.result))}catch(e){alert('JSON 读取失败。')}};r.readAsText(file)}
function download(name,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}

startBtn.onclick=startSession;dontKnowBtn.onclick=markDontKnow;nextBtn.onclick=nextQuestion;exitBtn.onclick=()=>{testView.style.display='none';homeView.style.display='block';if(db.session){db.session.queue=[...queue];db.session.qi=qi}save();updateHome()};
selfGradeBtns.querySelectorAll('button').forEach(b=>b.onclick=()=>manualGrade(b.dataset.grade));
newCap.onchange=()=>{db.settings.newCap=Number(newCap.value);save();updateHome()};
rebuildBtn.onclick=()=>{db.session=null;buildQueue();alert('今日队列已重建。');updateHome()};
exportBtn.onclick=()=>download(`TRKI_C1_backup_${dateKey()}.json`,{format:'TRKI-C1-SRS-backup',version:4,exportedAt:new Date().toISOString(),db});
vocabFile.onchange=e=>readJSON(e.target.files[0],x=>{const arr=Array.isArray(x)?x:(x.cards||x.vocabulary||x.words||[]);if(!Array.isArray(arr)){alert('词包格式不正确。');return}const before=cards().length;arr.forEach(mergeCard);save();updateHome();alert(`导入完成：新增 ${cards().length-before} 个词；重复词已合并。`);e.target.value=''});
backupFile.onchange=e=>readJSON(e.target.files[0],x=>{if(!x.db||!x.db.cards){alert('不是有效的完整备份。');return}db=x.db;SEED.forEach(mergeCard);if(!db.settings)db.settings={newCap:30};newCap.value=String(db.settings.newCap||30);save();updateHome();alert('备份已恢复。');e.target.value=''});

load();updateHome();
</script>
