<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ТРКИ-C1 词汇卡片 · Chrome版</title>
<style>
:root {
  --bg:#f4f4f7; --panel:#ffffff; --text:#17171a; --muted:#73737c; --line:#dedee6;
  --a:#eef3ff; --r:#f6efff; --g:#fff2cf;
  --good:#eaf7ed; --mid:#fff7d8; --bad:#fff0f0; --accent:#5b5bd6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#111116; --panel:#1c1c22; --text:#f4f4f5; --muted:#aaaab4; --line:#383841;
    --a:#242b42; --r:#31243b; --g:#3a311f;
    --good:#203127; --mid:#3a351f; --bad:#3b2424; --accent:#8a8af5;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC",Arial,sans-serif;
}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 42px}
h1{font-size:22px;margin:0 0 6px}
.sub{color:var(--muted);font-size:13px;line-height:1.55;margin-bottom:14px}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.toolbar .full{grid-column:1/-1}
button,select,input[type="search"],.filebtn{
  width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);
  border-radius:13px;padding:11px 12px;font-size:15px;
}
button,.filebtn{cursor:pointer}
button:active,.filebtn:active{transform:scale(.985)}
.filebtn{display:block;text-align:center}
input[type="file"]{display:none}
.statusbar{
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  color:var(--muted);font-size:12px;margin:8px 2px 12px
}
.save-ok{color:#2a8a4a} .save-warn{color:#b97800}
.progress{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:10px 0 16px}
.progress > div{height:100%;background:var(--accent);width:0%}
.cardwrap{perspective:1200px}
.card{
  position:relative;min-height:430px;transform-style:preserve-3d;
  transition:transform .42s ease;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.card.flipped{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1px solid var(--line);border-radius:26px;background:var(--panel);
  box-shadow:0 10px 30px rgba(0,0,0,.07);padding:28px;
  display:flex;flex-direction:column;align-items:center;justify-content:center
}
.back{transform:rotateY(180deg)}
.badges{display:flex;gap:8px;margin-bottom:20px}
.badge{font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px}
.badge.a{background:var(--a)} .badge.r{background:var(--r)} .badge.g{background:var(--g)}
.term{
  font-family:"Times New Roman",serif;font-size:40px;line-height:1.25;text-align:center;
  word-break:break-word
}
.meaning{font-size:27px;line-height:1.45;text-align:center;margin-bottom:20px}
.extra{
  width:100%;border-top:1px solid var(--line);padding-top:18px;
  font-size:18px;line-height:1.62;text-align:center
}
.tap{color:var(--muted);font-size:14px;margin-top:25px}
.ratebox{
  margin-top:14px;padding:14px;border:1px solid var(--line);
  border-radius:18px;background:var(--panel)
}
.rate-title{font-size:13px;color:var(--muted);margin-bottom:10px}
.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rates button{font-weight:600}
.rates .familiar.active{background:var(--good);border-color:#7ab88a}
.rates .fuzzy.active{background:var(--mid);border-color:#c4ad56}
.rates .unknown.active{background:var(--bad);border-color:#c67a7a}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stats{
  margin-top:14px;border:1px solid var(--line);background:var(--panel);
  border-radius:18px;padding:14px
}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{text-align:center;padding:10px 6px;border-radius:12px;background:var(--bg)}
.stat strong{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.note{color:var(--muted);font-size:12px;line-height:1.6;margin-top:12px}
.hidden{display:none!important}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
  background:rgba(20,20,24,.92);color:white;padding:10px 14px;border-radius:999px;
  font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s
}
.toast.show{opacity:1}
@media(max-width:560px){
  .toolbar{grid-template-columns:1fr}
  .toolbar .full{grid-column:auto}
  .card{min-height:440px}
  .term{font-size:34px} .meaning{font-size:24px} .face{padding:22px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>ТРКИ-C1 词汇卡片 · Chrome版</h1>
  <div class="sub">
    默认先用“学习轮”把词卡过一遍；切到“自评轮”后，你选择的“熟悉 / 模糊 / 不认识”会尝试自动保存在当前浏览器本地。
  </div>

  <div class="toolbar">
    <select id="mode" class="full">
      <option value="learn">学习轮（不计掌握度）</option>
      <option value="review">自评轮（记录熟悉 / 模糊 / 不认识）</option>
    </select>

    <select id="filter">
      <option value="all">全部词</option>
      <option value="AG">A + G 优先</option>
      <option value="A">全部 A</option>
      <option value="RG">R + G</option>
      <option value="R">全部 R</option>
      <option value="unrated">只看未自评</option>
      <option value="familiar">只看熟悉</option>
      <option value="fuzzy">只看模糊</option>
      <option value="unknown">只看不认识</option>
    </select>

    <button id="shuffleBtn">打乱当前卡组</button>
    <input id="search" class="full" type="search" placeholder="搜索俄语词或中文释义">
  </div>

  <div class="statusbar">
    <span id="counter">1 / 148</span>
    <span id="saveStatus">正在检查本地保存…</span>
  </div>

  <div class="progress"><div id="bar"></div></div>

  <div class="cardwrap">
    <div class="card" id="card">
      <div class="face front">
        <div class="badges" id="badgesFront"></div>
        <div class="term" id="term"></div>
        <div class="tap">轻点卡片翻面</div>
      </div>
      <div class="face back">
        <div class="badges" id="badgesBack"></div>
        <div class="meaning" id="meaning"></div>
        <div class="extra" id="extra"></div>
        <div class="tap">轻点卡片返回正面</div>
      </div>
    </div>
  </div>

  <div class="ratebox hidden" id="rateBox">
    <div class="rate-title">你的自评（仅在“自评轮”记录）</div>
    <div class="rates">
      <button class="familiar" data-rating="familiar">熟悉</button>
      <button class="fuzzy" data-rating="fuzzy">模糊</button>
      <button class="unknown" data-rating="unknown">不认识</button>
    </div>
  </div>

  <div class="nav">
    <button id="prevBtn">← 上一张</button>
    <button id="nextBtn">下一张 →</button>
  </div>

  <div class="stats">
    <div class="stats-grid">
      <div class="stat"><strong id="sFamiliar">0</strong><span>熟悉</span></div>
      <div class="stat"><strong id="sFuzzy">0</strong><span>模糊</span></div>
      <div class="stat"><strong id="sUnknown">0</strong><span>不认识</span></div>
      <div class="stat"><strong id="sUnrated">148</strong><span>未自评</span></div>
    </div>

    <div class="actions">
      <button id="exportJson">导出 JSON 记录</button>
      <button id="exportCsv">导出 CSV 记录</button>
      <label class="filebtn" for="importFile">导入 JSON 记录</label>
      <input id="importFile" type="file" accept=".json,application/json">
      <button id="clearRatings">清空全部自评</button>
    </div>
  </div>

  <div class="note">
    <b>建议用法：</b>第一遍只学习，不急着点自评。等你准备正式区分掌握度时切到“自评轮”。<br>
    <b>本地保存：</b>只保存在你当前浏览器/当前设备，不会自动同步给 ChatGPT。若浏览器不允许本地保存，页面会明确提示。<br>
    <b>导出：</b>JSON 最适合之后发回给我继续做间隔复习；CSV 方便你自己查看或存表格。
  </div>
</div>

<div class="toast" id="toast"></div>

const STORAGE_KEY = "trki_c1_flashcards_state_v2";

let state = {
  ratings: {},
  updatedAt: null
};
let deck = [...ALL];
let idx = 0;
let flipped = false;
let storageAvailable = false;

const $ = id => document.getElementById(id);

function cardKey(c) { return c.term; }

function badgeHTML(c) {
  let s = `<span class="badge ${c.level.toLowerCase()}">${c.level}</span>`;
  if (c.g) s += `<span class="badge g">G</span>`;
  return s;
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1700);
}

function checkStorage() {
  try {
    const k = "__trki_test__";
    localStorage.setItem(k, "1");
    localStorage.removeItem(k);
    storageAvailable = true;
    $("saveStatus").textContent = "自动保存：可用";
    $("saveStatus").className = "save-ok";
    return true;
  } catch (e) {
    storageAvailable = false;
    $("saveStatus").textContent = "自动保存：当前浏览器未开放（请定期导出 JSON）";
    $("saveStatus").className = "save-warn";
    return false;
  }
}

function loadState() {
  if (!checkStorage()) return;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved && typeof saved === "object") {
      state.ratings = saved.ratings || {};
      state.updatedAt = saved.updatedAt || null;
    }
  } catch (e) {
    console.warn("读取本地进度失败", e);
  }
}

function saveState() {
  state.updatedAt = new Date().toISOString();
  if (!storageAvailable) return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    storageAvailable = false;
    $("saveStatus").textContent = "自动保存失败（请导出 JSON）";
    $("saveStatus").className = "save-warn";
  }
}

function currentRating(c) {
  const r = state.ratings[cardKey(c)];
  return r ? r.rating : null;
}

function applyFilter(resetIndex=true) {
  const filter = $("filter").value;
  const q = $("search").value.trim().toLowerCase();

  deck = ALL.filter(c => {
    const rating = currentRating(c);
    let ok = true;
    if (filter === "AG") ok = c.level === "A" && c.g;
    else if (filter === "A") ok = c.level === "A";
    else if (filter === "RG") ok = c.level === "R" && c.g;
    else if (filter === "R") ok = c.level === "R";
    else if (filter === "unrated") ok = !rating;
    else if (filter === "familiar") ok = rating === "familiar";
    else if (filter === "fuzzy") ok = rating === "fuzzy";
    else if (filter === "unknown") ok = rating === "unknown";

    if (!ok) return false;
    if (!q) return true;

    const hay = `${c.term} ${c.meaning} ${c.extra || ""}`.toLowerCase();
    return hay.includes(q);
  });

  if (resetIndex) idx = 0;
  if (idx >= deck.length) idx = 0;
  flipped = false;
  render();
}

function render() {
  updateStats();

  if (!deck.length) {
    $("term").textContent = "没有符合条件的卡片";
    $("meaning").textContent = "请修改筛选条件或搜索关键词";
    $("extra").textContent = "";
    $("badgesFront").innerHTML = "";
    $("badgesBack").innerHTML = "";
    $("counter").textContent = "0 / 0";
    $("bar").style.width = "0%";
    $("card").classList.remove("flipped");
    $("rateBox").classList.add("hidden");
    return;
  }

  const c = deck[idx];
  $("badgesFront").innerHTML = badgeHTML(c);
  $("badgesBack").innerHTML = badgeHTML(c);
  $("term").textContent = c.term;
  $("meaning").textContent = c.meaning;
  $("extra").textContent = c.extra || (c.g ? "重点：格支配 / 固定搭配" : "—");
  $("counter").textContent = `${idx + 1} / ${deck.length}`;
  $("bar").style.width = `${((idx + 1) / deck.length) * 100}%`;

  $("card").classList.toggle("flipped", flipped);

  const reviewMode = $("mode").value === "review";
  $("rateBox").classList.toggle("hidden", !reviewMode);

  document.querySelectorAll("[data-rating]").forEach(btn => btn.classList.remove("active"));
  const r = currentRating(c);
  if (r) {
    const btn = document.querySelector(`[data-rating="${r}"]`);
    if (btn) btn.classList.add("active");
  }
}

function updateStats() {
  let familiar = 0, fuzzy = 0, unknown = 0;
  for (const c of ALL) {
    const r = currentRating(c);
    if (r === "familiar") familiar++;
    else if (r === "fuzzy") fuzzy++;
    else if (r === "unknown") unknown++;
  }
  $("sFamiliar").textContent = familiar;
  $("sFuzzy").textContent = fuzzy;
  $("sUnknown").textContent = unknown;
  $("sUnrated").textContent = ALL.length - familiar - fuzzy - unknown;
}

function nextCard() {
  if (!deck.length) return;
  idx = (idx + 1) % deck.length;
  flipped = false;
  render();
}

function prevCard() {
  if (!deck.length) return;
  idx = (idx - 1 + deck.length) % deck.length;
  flipped = false;
  render();
}

function setRating(rating) {
  if ($("mode").value !== "review" || !deck.length) return;
  const c = deck[idx];
  const k = cardKey(c);
  const prev = state.ratings[k] || {};
  state.ratings[k] = {
    rating,
    selfAssessment: true,
    reviewCount: (prev.reviewCount || 0) + 1,
    lastRatedAt: new Date().toISOString()
  };
  saveState();
  updateStats();
  render();
  toast(rating === "familiar" ? "已标记：熟悉" : rating === "fuzzy" ? "已标记：模糊" : "已标记：不认识");
  setTimeout(nextCard, 180);
}

function download(filename, text, type) {
  const blob = new Blob([text], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportJSON() {
  const payload = {
    format: "TRKI-C1 flashcard progress",
    version: 2,
    exportedAt: new Date().toISOString(),
    totals: { total: ALL.length, A: 77, R: 71, G: 42 },
    ratings: state.ratings,
    cards: ALL.map(c => ({
      term: c.term,
      level: c.level,
      g: !!c.g,
      meaning: c.meaning,
      extra: c.extra || "",
      rating: currentRating(c),
      ratingMeta: state.ratings[cardKey(c)] || null
    }))
  };
  download(
    `TRKI_C1_progress_${new Date().toISOString().slice(0,10)}.json`,
    JSON.stringify(payload, null, 2),
    "application/json;charset=utf-8"
  );
}

function csvEscape(v) {
  const s = String(v ?? "");
  return `"${s.replace(/"/g, '""')}"`;
}

function exportCSV() {
  const header = ["term","level","G","meaning","extra","rating","lastRatedAt","reviewCount"];
  const rows = ALL.map(c => {
    const meta = state.ratings[cardKey(c)] || {};
    return [
      c.term, c.level, c.g ? "1" : "0", c.meaning, c.extra || "",
      meta.rating || "", meta.lastRatedAt || "", meta.reviewCount || 0
    ];
  });
  const csv = [header, ...rows].map(row => row.map(csvEscape).join(",")).join("\n");
  download(
    `TRKI_C1_progress_${new Date().toISOString().slice(0,10)}.csv`,
    "\ufeff" + csv,
    "text/csv;charset=utf-8"
  );
}

  reader.onload = e => {
    try {
      const payload = JSON.parse(e.target.result);
      const incoming = payload.ratings || (payload.state && payload.state.ratings);
      if (!incoming || typeof incoming !== "object") throw new Error("记录格式不正确");
      state.ratings = incoming;
      state.updatedAt = new Date().toISOString();
      saveState();
      applyFilter(true);
      toast("进度已导入");
    } catch (err) {
      alert("导入失败：这不是可识别的 TRKI-C1 进度 JSON。");
    }
  };
  reader.readAsText(file);
}

$("card").addEventListener("click", () => {
  if (!deck.length) return;
  flipped = !flipped;
  render();
});

$("nextBtn").addEventListener("click", nextCard);
$("prevBtn").addEventListener("click", prevCard);

$("mode").addEventListener("change", () => {
  flipped = false;
  render();
});

$("filter").addEventListener("change", () => applyFilter(true));
$("search").addEventListener("input", () => applyFilter(true));

$("shuffleBtn").addEventListener("click", () => {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  idx = 0;
  flipped = false;
  render();
  toast("已打乱当前卡组");
});

document.querySelectorAll("[data-rating]").forEach(btn => {
  btn.addEventListener("click", e => {
    e.stopPropagation();
    setRating(btn.dataset.rating);
  });
});

$("exportJson").addEventListener("click", exportJSON);
$("exportCsv").addEventListener("click", exportCSV);

$("importFile").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if (file) importJSON(file);
  e.target.value = "";
});

$("clearRatings").addEventListener("click", () => {
  if (!confirm("确定要清空全部“熟悉 / 模糊 / 不认识”自评吗？此操作不会删除词库。")) return;
  state.ratings = {};
  saveState();
  applyFilter(true);
  toast("全部自评已清空");
});

loadState();
applyFilter(true);
</script>
</body>
</html>
