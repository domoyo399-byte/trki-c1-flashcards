<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ТРКИ-C1 智能词汇测试 v5</title>
<style>
:root{--bg:#f5f5f8;--p:#fff;--t:#17171a;--m:#777780;--l:#dddde5;--ac:#5b5bd6;--ok:#eaf7ed;--mid:#fff5d3;--bad:#fff0f0;--chip:#f0f0f5}
@media(prefers-color-scheme:dark){:root{--bg:#111116;--p:#1d1d23;--t:#f5f5f6;--m:#aaaab4;--l:#393942;--ac:#9292ff;--ok:#203127;--mid:#3b351f;--bad:#3c2424;--chip:#292930}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",Arial,sans-serif}
.wrap{max-width:820px;margin:auto;padding:18px 16px 42px}h1{font-size:22px;margin:0 0 5px}.sub,.muted{color:var(--m);font-size:13px;line-height:1.6}
.panel{background:var(--p);border:1px solid var(--l);border-radius:20px;padding:15px;margin-top:13px}.panel h3{margin:0 0 10px;font-size:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{text-align:center;background:var(--bg);padding:11px 4px;border-radius:13px}.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:var(--m)}
button,input,select,.filebtn{width:100%;border:1px solid var(--l);background:var(--p);color:var(--t);border-radius:13px;padding:12px;font-size:15px}button,.filebtn{cursor:pointer}.primary{background:var(--ac);color:white;border:0;font-weight:700;font-size:17px;padding:14px}.secondary{font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.filebtn{text-align:center;display:block}input[type=file]{display:none}
.taskrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--l)}.taskrow:last-child{border:0}.taskrow span:last-child{text-align:right}
.freeze{background:var(--chip);padding:10px 12px;border-radius:12px;margin-top:10px;font-size:13px;line-height:1.55}
#test,#browser{display:none}.topline{display:flex;justify-content:space-between;gap:10px;color:var(--m);font-size:13px;margin-bottom:10px}.bar{height:7px;background:var(--l);border-radius:99px;overflow:hidden;margin-bottom:14px}.bar div{height:100%;background:var(--ac)}
.qbox{background:var(--p);border:1px solid var(--l);border-radius:24px;padding:24px;min-height:370px;display:flex;flex-direction:column;justify-content:center}.tag{font-size:12px;color:var(--m);text-align:center;margin-bottom:14px}.prompt{font-size:27px;text-align:center;line-height:1.5}.ru{font-family:"Times New Roman",serif;font-size:38px}
.answer{margin-top:22px}.answer input{font-family:"Times New Roman",serif;font-size:21px;padding:14px}.choices{display:grid;gap:9px;margin-top:20px}.choices button{text-align:left;padding:14px}
.feedback{margin-top:14px;padding:14px;border-radius:13px;line-height:1.65;display:none}.feedback.ok{display:block;background:var(--ok)}.feedback.bad{display:block;background:var(--bad)}.feedback.mid{display:block;background:var(--mid)}.backdetails{margin-top:8px;padding-top:8px;border-top:1px solid var(--l)}
.smallbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.hidden{display:none!important}
.conjgrid{display:grid;grid-template-columns:52px 1fr;gap:8px 10px;align-items:center;margin-top:12px}.conjgrid input{padding:11px}.person{font-weight:700;text-align:right}
.browser-card{background:var(--p);border:1px solid var(--l);border-radius:24px;min-height:390px;padding:24px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}.browser-term{text-align:center;font-family:"Times New Roman",serif;font-size:40px}.browser-back{display:none}.browser-card.flipped .browser-front{display:none}.browser-card.flipped .browser-back{display:block}.browser-meaning{text-align:center;font-size:25px;line-height:1.5}.detail{border-top:1px solid var(--l);margin-top:16px;padding-top:14px;line-height:1.65}.badges{text-align:center;margin-bottom:15px}.badge{display:inline-block;background:var(--chip);padding:5px 9px;border-radius:999px;font-size:12px;margin:0 3px}.browsernav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media(max-width:560px){.grid4{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:1fr}.prompt{font-size:24px}.ru{font-size:33px}.qbox{padding:20px}.smallbtns{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">

<section id="home">
<h1>ТРКИ-C1 智能词汇测试</h1>
<div class="sub">A 类主动输出 · R 类快速识别 · G 类额外检查格支配/搭配。今日新词批次一旦生成就锁定，不会把“明天的新词”提前塞进今天。</div>

<div class="panel"><div class="grid4">
<div class="stat"><b id="total">0</b><span>总词库</span></div>
<div class="stat"><b id="aN">0</b><span>A</span></div>
<div class="stat"><b id="rN">0</b><span>R</span></div>
<div class="stat"><b id="gN">0</b><span>G</span></div>
</div></div>

<div class="panel">
<h3>每日设置</h3>
<div class="taskrow"><span>每日新词上限</span>
<select id="newCap" style="max-width:150px">
<option value="0">0（只复习）</option><option value="10">10</option><option value="20">20</option><option value="30">30</option>
</select></div>
<div class="muted" id="capNote" style="margin-top:8px"></div>
</div>

<div class="panel">
<h3>今天 · <span id="todayLabel"></span></h3>
<div class="taskrow"><span>🆕 今日固定新词</span><span id="todayNew">0</span></div>
<div class="taskrow"><span>🔁 今日到期/旧词复习</span><span id="todayReview">0</span></div>
<div class="taskrow"><span>⚠️ 弱项复习</span><span id="weakN">0</span></div>
<div class="taskrow"><span>✅ 今日已答</span><span id="doneN">0</span></div>
<div class="freeze" id="freezeText"></div>
<button class="primary" id="startToday" style="margin-top:12px">开始 / 继续今日任务</button>
<div class="actions">
<button class="secondary" id="reviewToday">复习今天学过的词</button>
<button class="secondary" id="reviewOld">只复习已学旧词（0 新词）</button>
</div>
</div>

<div class="panel">
<h3>词卡浏览</h3>
<div class="muted">正面保持俄语词条；翻面可看释义、搭配/构词提示，以及特殊动词的 я / ты / они 变位。</div>
<button id="openBrowser" style="margin-top:10px">打开词卡浏览</button>
</div>

<div class="panel"><h3>词库与备份</h3><div class="actions">
<label class="filebtn" for="importVocab">导入新词包 JSON</label><input id="importVocab" type="file" accept=".json">
<button id="exportBackup">导出完整备份</button>
<label class="filebtn" for="importBackup">恢复完整备份</label><input id="importBackup" type="file" accept=".json">
<button id="resetToday">重建“今天”任务</button>
</div><div class="muted" style="margin-top:10px">重建今天只影响今日队列，不删除历史成绩。为了避免误吃明天的新词，系统不会在同一天自动追加未分配的新词。</div></div>
</section>

<section id="test">
<div class="topline"><span id="qCount"></span><span id="qKind"></span></div><div class="bar"><div id="prog"></div></div>
<div class="qbox">
<div class="tag" id="tag"></div><div class="prompt" id="prompt"></div>
<div class="answer" id="answer"></div><div class="feedback" id="feedback"></div>
<div class="smallbtns">
<button id="dontKnow">不认识 / 想不起来</button>
<button id="fuzzyBtn" class="hidden">模糊 / 蒙的</button>
<button id="next" class="hidden">下一题</button>
</div>
</div>
<button id="exit" style="margin-top:12px">结束本轮并返回首页</button>
</section>

<section id="browser">
<div class="topline"><span id="bCount"></span><span>点卡片翻面</span></div>
<div class="browser-card" id="browserCard">
<div class="browser-front"><div class="badges" id="bBadges"></div><div class="browser-term" id="bTerm"></div></div>
<div class="browser-back"><div class="badges" id="bBadges2"></div><div class="browser-meaning" id="bMeaning"></div><div class="detail" id="bDetail"></div></div>
</div>
<div class="browsernav"><button id="bPrev">← 上一张</button><button id="bNext">下一张 →</button></div>
<button id="closeBrowser" style="margin-top:10px">返回首页</button>
</section>

</div>

  out.history=out.history||[]; return out;
}
function findLegacy(){
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i); if(k===KEY)continue;
      if(!/trki/i.test(k))continue;
      try{
        let x=JSON.parse(localStorage.getItem(k)); let obj=x&&x.db?x.db:x;
        if(obj&&obj.cards&&Object.keys(obj.cards).length>20)return obj;
      }catch(e){}
    }
  }catch(e){}
  return null
}
function load(){
  let saved=null;
  try{saved=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
  if(!saved||!saved.cards)saved=findLegacy();
  if(saved&&saved.cards)db=saved;
  db.settings=db.settings||{newCap:20}; if(db.settings.newCap===undefined)db.settings.newCap=20;
  const oldCards=db.cards||{}; const byNorm={}; Object.values(oldCards).forEach(c=>byNorm[id(c)]=c);
  const merged={}; SEED.forEach(s=>{let k=id(s);merged[k]=mergeContent(byNorm[k],s)});
  // Keep any user-imported cards not present in seed.
  Object.values(oldCards).forEach(c=>{let k=id(c);if(!merged[k])merged[k]=c});
  db.cards=merged;
  rolloverDay();
  save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function rolloverDay(){
  const td=localDate();
  if(!db.day||db.day.date!==td){
    db.day={date:td,initialized:false,newIds:[],reviewIds:[],weakIds:[],assignedIds:[],queue:[],qi:0,reviewedToday:[],completed:[]}
  }
}
function dueCards(){let now=Date.now();return all().filter(c=>c.status!=="new"&&c.nextDue&&c.nextDue<=now)}
function weakCards(){return all().filter(c=>c.status!=="new"&&((c.lapses||0)>0||(c.streak||0)<2))}
function buildToday(force=false){
  rolloverDay(); if(db.day.initialized&&!force)return;
  const due=dueCards();
  const weak=weakCards().filter(c=>!due.some(d=>id(d)===id(c))).sort((a,b)=>(b.lapses||0)-(a.lapses||0)).slice(0,20);
  const cap=Number(db.settings.newCap||0);
  const news=all().filter(c=>c.status==="new").slice(0,cap);
  db.day.newIds=news.map(id); db.day.reviewIds=due.map(id); db.day.weakIds=weak.map(id);
  let mixed=[],pools=[news.slice(),due.slice(),weak.slice()];
  while(pools.some(p=>p.length)){for(const p of pools)if(p.length)mixed.push(id(p.shift()))}
  db.day.assignedIds=[...new Set(mixed)];
  db.day.queue=mixed;db.day.qi=0;db.day.initialized=true;db.day.completed=[];save()
}
function updateHome(){
  rolloverDay();
  const arr=all(); $("total").textContent=arr.length;$("aN").textContent=arr.filter(c=>c.level==="A").length;
  $("rN").textContent=arr.filter(c=>c.level==="R").length;$("gN").textContent=arr.filter(c=>c.g).length;
  $("todayLabel").textContent=db.day.date;$("newCap").value=String(db.settings.newCap??20);
  if(db.day.initialized){
    $("todayNew").textContent=db.day.newIds.length;$("todayReview").textContent=db.day.reviewIds.length;
    $("weakN").textContent=db.day.weakIds.length;$("doneN").textContent=new Set(db.day.reviewedToday||[]).size;
    $("freezeText").textContent=`今日批次已锁定：${db.day.newIds.length} 个新词。明日新词尚未分配，不会提前出现。`;
    $("capNote").textContent="今天的批次已经生成。这里改成 0 不会删除今天已分配的词；它会影响下一次生成的新批次。若现在只想复习旧词，请点“只复习已学旧词”。";
  }else{
    const cap=Number(db.settings.newCap||0);
    $("todayNew").textContent=Math.min(cap,arr.filter(c=>c.status==="new").length);
    $("todayReview").textContent=dueCards().length;$("weakN").textContent=Math.min(20,weakCards().length);$("doneN").textContent=0;
    $("freezeText").textContent=`今天的批次还没生成。点击“开始今日任务”后，会按当前新词上限（${cap}）生成并锁定今天内容。`;
    $("capNote").textContent=cap===0?"当前为 0：今天生成任务时不会加入任何新词，只安排复习。":"你可以在生成今天任务前改为 0 / 10 / 20 / 30。";
  }
}
$("newCap").onchange=()=>{db.settings.newCap=Number($("newCap").value);save();updateHome()};

function baseTarget(c){
  let s=c.term;
  s=s.replace(/\s*\+\s*[ДРВТП]\.?/gi,"");
  s=s.replace(/\s+(кого\/что|кого|чем с кем|чем|кому|чему|с кем|кем\/чем|кем)\b/gi,"");
  return s.trim()
}
function grammarHint(c){
  const m=c.term.match(/(?:[а-яё\/ ]+)?\+\s*[ДРВТП]\.?/i);
  if(m)return m[0].trim();
  if(c.extra&&/[ДРВТП]\./.test(c.extra))return c.extra.split(/[；;]/)[0].trim();
  return c.extra||""
}
function distractors(c){
  let pool=all().filter(x=>id(x)!==id(c)&&x.level==="R").map(x=>x.meaning);
  if(pool.length<3)pool=all().filter(x=>id(x)!==id(c)).map(x=>x.meaning);
  pool=[...new Set(pool)];
  for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  return pool.slice(0,3)
}
function qType(c){
  if(c.level==="R")return "mc";
  if(c.conjugation&&db.settings.conjugationQuiz!==false&&(c.seen||0)>=2&&(c.seen||0)%5===2)return "conj";
  if(c.g&&(c.seen||0)>=1&&(c.seen||0)%3===1)return "gov";
  return "typing"
}
function detailHTML(c){
  let parts=[];
  if(c.extra)parts.push(`<b>搭配 / 支配：</b>${c.extra}`);
  if(c.backNote)parts.push(`<b>常见用法 / 构词：</b>${c.backNote}`);
  if(c.conjugation){
    const x=c.conjugation;
    parts.push(`<b>变位（${x.lemma}）：</b>я ${x["я"]} · ты ${x["ты"]} · они ${x["они"]}${x.note?`<br><span class="muted">${x.note}</span>`:""}`);
  }
  return parts.join("<br><br>")||"—"
}
function launch(q,whichMode){
  queue=q.slice();qi=0;mode=whichMode;$("home").style.display="none";$("browser").style.display="none";$("test").style.display="block";showQ()
}
$("startToday").onclick=()=>{buildToday(false);const start=Math.min(db.day.qi||0,db.day.queue.length);launch(db.day.queue.slice(start),"today")}
$("reviewToday").onclick=()=>{
  rolloverDay();
  let ids=[...new Set([...(db.day.newIds||[]),...(db.day.reviewedToday||[])])].filter(k=>db.cards[k]);
  if(!ids.length){alert("今天还没有可复习的词。");return} launch(ids,"reviewToday")
}
$("reviewOld").onclick=()=>{
  let arr=all().filter(c=>c.status!=="new");
  arr.sort((a,b)=>((b.lapses||0)-(a.lapses||0))||((a.lastReviewed||0)-(b.lastReviewed||0)));
  let ids=arr.slice(0,40).map(id); if(!ids.length){alert("还没有已学旧词。");return} launch(ids,"old")
}
function showQ(){
  if(qi>=queue.length){finish();return}
  answered=false;pendingCorrectMC=false;$("next").classList.add("hidden");$("fuzzyBtn").classList.add("hidden");$("dontKnow").classList.remove("hidden");
  const fb=$("feedback");fb.className="feedback";fb.innerHTML="";
  const c=db.cards[queue[qi]];if(!c){qi++;showQ();return}
  $("qCount").textContent=`${qi+1} / ${queue.length}`;$("prog").style.width=`${(qi/Math.max(1,queue.length))*100}%`;
  $("tag").textContent=`${c.level}${c.g?" · G":""}`;$("answer").innerHTML="";
  const type=qType(c);
  if(type==="mc"){
    $("qKind").textContent="俄语 → 中文 · 选择";$("prompt").innerHTML=`<span class="ru">${c.term}</span>`;
    let opts=[c.meaning,...distractors(c)].sort(()=>Math.random()-.5),box=document.createElement("div");box.className="choices";
    opts.forEach(o=>{let b=document.createElement("button");b.textContent=o;b.onclick=()=>gradeMC(c,o);box.appendChild(b)});$("answer").appendChild(box)
  }else if(type==="gov"){
    $("qKind").textContent="格支配 / 固定搭配 · 输入";$("prompt").innerHTML=`请写出 <span class="ru">${baseTarget(c)}</span> 的支配关系 / 固定搭配`;
    makeInput(c,"gov")
  }else if(type==="conj"){
    $("qKind").textContent="特殊变位 · я / ты / они";$("prompt").innerHTML=`<span class="ru">${c.conjugation.lemma}</span>`;
    makeConj(c)
  }else{
    $("qKind").textContent="中文 → 俄语 · 输入";$("prompt").textContent=c.meaning;makeInput(c,"typing")
  }
}
function makeInput(c,type){
  let inp=document.createElement("input");inp.placeholder=type==="gov"?"例如：к + Д. / от + Р.":"输入俄语词 / 表达";inp.autocapitalize="off";inp.autocomplete="off";inp.spellcheck=false;
  let b=document.createElement("button");b.textContent="提交";b.style.marginTop="9px";b.onclick=()=>gradeText(c,inp.value,type);inp.onkeydown=e=>{if(e.key==="Enter")b.click()};
  $("answer").append(inp,b);setTimeout(()=>inp.focus(),80)
}
function makeConj(c){
  let wrap=document.createElement("div");wrap.className="conjgrid",inputs={};
  ["я","ты","они"].forEach(p=>{let l=document.createElement("div");l.className="person";l.textContent=p;let inp=document.createElement("input");inp.placeholder="输入变位";inp.autocapitalize="off";inp.spellcheck=false;inputs[p]=inp;wrap.append(l,inp)});
  let b=document.createElement("button");b.textContent="提交";b.style.marginTop="12px";b.onclick=()=>gradeConj(c,inputs);$("answer").append(wrap,b);setTimeout(()=>inputs["я"].focus(),80)
}
function mark(c,grade,errorType){
  const now=Date.now();c.seen=(c.seen||0)+1;c.lastReviewed=now;c.history=c.history||[];c.errors=c.errors||{};
  c.status="learning";
  if(grade==="correct"){
    c.streak=(c.streak||0)+1;let days=c.streak>=5?30:c.streak===4?14:c.streak===3?7:c.streak===2?3:1;c.nextDue=now+days*DAY
  }else if(grade==="fuzzy"){
    c.streak=0;c.lapses=(c.lapses||0)+1;c.nextDue=now+DAY;if(errorType)c.errors[errorType]=(c.errors[errorType]||0)+1
  }else{
    c.streak=0;c.lapses=(c.lapses||0)+1;c.lastWrong=now;c.nextDue=now+DAY;if(errorType)c.errors[errorType]=(c.errors[errorType]||0)+1;
    if(!queue.slice(qi+1).includes(id(c)))queue.push(id(c))
  }
  c.history.push({time:now,grade,errorType:errorType||null});
  rolloverDay();if(!db.day.reviewedToday.includes(id(c)))db.day.reviewedToday.push(id(c));
  if(mode==="today")db.day.qi=Math.min((db.day.qi||0)+1,db.day.queue.length);
  save()
}
function showFeedback(c,cls,title){let f=$("feedback");f.className="feedback "+cls;f.innerHTML=`${title}<br><b>${c.term}</b> — ${c.meaning}<div class="backdetails">${detailHTML(c)}</div>`}
function after(c){answered=true;$("dontKnow").classList.add("hidden");$("next").classList.remove("hidden");save()}
function gradeMC(c,o){
  if(answered)return;
  if(o!==c.meaning){mark(c,"wrong","meaning");showFeedback(c,"bad","❌ 错误");after(c);return}
  pendingCorrectMC=true;showFeedback(c,"ok","✅ 选对了。若是蒙的/不稳，请点下面“模糊 / 蒙的”。");
  $("dontKnow").classList.add("hidden");$("fuzzyBtn").classList.remove("hidden");$("next").classList.remove("hidden");
}
$("fuzzyBtn").onclick=()=>{
  if(!pendingCorrectMC)return;const c=db.cards[queue[qi]];mark(c,"fuzzy","meaning");pendingCorrectMC=false;showFeedback(c,"mid","△ 记为模糊 / 蒙对");$("fuzzyBtn").classList.add("hidden");after(c)
}
$("next").onclick=()=>{
  if(pendingCorrectMC){const c=db.cards[queue[qi]];mark(c,"correct",null);pendingCorrectMC=false}
  qi++;showQ()
}
function gradeText(c,v,type){
  if(answered)return;
  let ok=false,errorType=type==="gov"?"governance":"spelling";
  if(type==="typing"){ok=norm(v)===norm(baseTarget(c)); if(!ok&&norm(v).length<2)errorType="recall"}
  else{
    const target=grammarHint(c),vs=norm(v),ts=norm(target);
    const chunks=ts.split(/[；;\/]/).map(x=>x.trim()).filter(Boolean);
    ok=vs===ts||chunks.some(x=>vs===x)||chunks.some(x=>vs.includes(x)&&x.length>=3);
  }
  mark(c,ok?"correct":"wrong",ok?null:errorType);showFeedback(c,ok?"ok":"bad",ok?"✅ 正确":"❌ 需要复习");after(c)
}
function gradeConj(c,inputs){
  if(answered)return;const x=c.conjugation;
  let ok=["я","ты","они"].every(p=>norm(inputs[p].value)===norm(x[p]));
  mark(c,ok?"correct":"wrong",ok?null:"conjugation");showFeedback(c,ok?"ok":"bad",ok?"✅ 变位正确":"❌ 变位需要复习");after(c)
}
$("dontKnow").onclick=()=>{if(answered)return;const c=db.cards[queue[qi]];mark(c,"wrong","recall");showFeedback(c,"bad","❌ 标记为不认识 / 想不起来");after(c)}
function finish(){
  alert("本轮完成。今天的新词批次不会自动追加；想继续可以复习今天或已学旧词。");
  $("test").style.display="none";$("home").style.display="block";updateHome()
}
$("exit").onclick=()=>{$("test").style.display="none";$("home").style.display="block";updateHome()}

$("resetToday").onclick=()=>{
  if(!confirm("重建今天任务会重新生成今日队列，但不会删除历史成绩。确定继续？"))return;
  db.day.initialized=false;db.day.queue=[];db.day.qi=0;buildToday(true);updateHome();alert("今天任务已按当前新词上限重新生成并锁定。")
}

// Browser
$("openBrowser").onclick=()=>{browserDeck=all();bi=0;$("home").style.display="none";$("browser").style.display="block";renderBrowser()}
$("closeBrowser").onclick=()=>{$("browser").style.display="none";$("home").style.display="block";updateHome()}
$("browserCard").onclick=()=>{$("browserCard").classList.toggle("flipped")}
$("bPrev").onclick=()=>{bi=(bi-1+browserDeck.length)%browserDeck.length;renderBrowser()}
$("bNext").onclick=()=>{bi=(bi+1)%browserDeck.length;renderBrowser()}
function renderBrowser(){
  if(!browserDeck.length)return;const c=browserDeck[bi];$("browserCard").classList.remove("flipped");
  $("bCount").textContent=`${bi+1} / ${browserDeck.length}`;$("bBadges").innerHTML=$("bBadges2").innerHTML=`<span class="badge">${c.level}</span>${c.g?'<span class="badge">G</span>':""}`;
  $("bTerm").textContent=c.term;$("bMeaning").textContent=c.meaning;$("bDetail").innerHTML=detailHTML(c)
}

// Import / export
function download(name,text){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([text],{type:"application/json;charset=utf-8"}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),800)}
$("exportBackup").onclick=()=>download("TRKI_C1_backup_"+localDate()+".json",JSON.stringify({format:"TRKI-C1-SRS-backup",version:5,exportedAt:new Date().toISOString(),db},null,2))
function readJSON(file,cb){if(!file)return;let r=new FileReader();r.onload=()=>{try{cb(JSON.parse(r.result))}catch(e){alert("JSON 读取失败")}};r.readAsText(file)}
$("importBackup").onchange=e=>readJSON(e.target.files[0],x=>{
  let obj=x&&x.db?x.db:x;if(!obj||!obj.cards){alert("不是有效备份");return}
  db=obj;const old=Object.values(db.cards);const by={};old.forEach(c=>by[id(c)]=c);const merged={};SEED.forEach(s=>merged[id(s)]=mergeContent(by[id(s)],s));old.forEach(c=>{if(!merged[id(c)])merged[id(c)]=c});db.cards=merged;rolloverDay();save();updateHome();alert("备份已恢复，并已套用新版词条内容。")
})
$("importVocab").onchange=e=>readJSON(e.target.files[0],x=>{
  let arr=Array.isArray(x)?x:(x.cards||x.vocabulary||[]);if(!Array.isArray(arr)){alert("词包格式不正确");return}
  let before=all().length;arr.forEach(s=>{if(!s.term||!s.level)return;let k=id(s),ex=db.cards[k];db.cards[k]=mergeContent(ex,{...s,contentId:k})});save();updateHome();alert("导入完成：新增 "+(all().length-before)+" 个词；重复词已合并且保留旧进度。")
})

load();updateHome();
</script></body></html>
